[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tracecv"
version = "1.0.0"
description = "Intervention-tested visual change detection and learned re-observation"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Tarang Jammalamadaka"}]
requires-python = ">=3.11,<3.14"
dependencies = ["torch>=2.6", "numpy>=1.26,<3", "scipy>=1.13", "Pillow>=10", "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.9"]
research = ["matplotlib>=3.9,<4"]

[project.urls]
Homepage = "https://github.com/tarang-tj/trace"
Repository = "https://github.com/tarang-tj/trace"
Documentation = "https://github.com/tarang-tj/trace/blob/main/README.md"

[project.scripts]
tracecv = "tracecv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
